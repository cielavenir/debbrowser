#!/usr/sbin/lighttpd -Df

server.document-root = var.CWD

include_shell "for u in www-data _www www; do id -u $u >/dev/null 2>&1 && printf 'server.username = \"%s\"\nserver.groupname = \"%s\"\n' $u $u && break; done"
server.port = 8080

server.modules += ( "mod_cgi" )

server.max-request-field-size = 32768

index-file.names = ( "index.cgi" )

mimetype.assign = (
	".html" => "text/html",
	".htm" => "text/html",
	".css" => "text/css",
	".js" => "text/javascript",
	".txt" => "text/plain",
	".png" => "image/png",
	".jpg" => "image/jpeg",
)

cgi.assign = (
	".cgi" => "",
)
